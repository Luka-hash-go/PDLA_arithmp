[project]
name = "arithmp"
version = "0.1.0"
description = "Command-line interface for the Arithmp package"
readme = "README.md"
authors = [{ name = "Mikaël Capelle", email = "capelle.mikael@gmail.com" }]
requires-python = ">=3.13"
dependencies = ["click>=8.5.0", "lark>=1.3.1"]

[project.scripts]
arithmp = "arithmp.__main__:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.poe.tasks]
format-imports = "ruff check --select I src tests --fix"
format-ruff = "ruff format src tests"
format.sequence = ["format-imports", "format-ruff"]
lint-ruff = "ruff check src tests"
lint-ruff-format = "ruff format --check src tests"
lint-ty = "ty check src tests"
lint.sequence = ["lint-ruff", "lint-ruff-format", "lint-ty"]
lint.ignore_fail = "return_non_zero"

[tool.ruff.lint]
# Configuration allégée : on cible les bugs (B), le tri des imports (I) et les guillemets (Q)
extend-select = ["B", "I", "Q"]
preview = true

[tool.ruff.lint.per-file-ignores]
# Autorise l'utilisation de assert dans les tests
"tests/*" = ["assert"]

[tool.ty.analysis]
strict-literal-narrowing = true
