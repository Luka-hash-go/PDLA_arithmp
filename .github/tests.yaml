#definition du nom

name : Tests CI

#Etape tests

on: 
  push:
    branches:
      - main # une fois test pull request reussie refaire tourner test sur le main pour voir si tout marche
  pull request: 


jobs: # contenu des tests et préparation à faire
  test:
    runs-on: ubuntu-latest #mon system actuel + cela est apparement vu les recherches sur internet le systeme natif sur github
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest