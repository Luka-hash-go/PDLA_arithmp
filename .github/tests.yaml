#definition du nom

name : Tests CI

#Etape tests

on: [push,pull_request] #on active ce test lors push et pull_request


jobs: # contenu des tests et préparation à faire
  test:
    runs-on: ubuntu-latest #mon system actuel + cela est apparement vu les recherches sur internet le systeme natif sur github
    steps:
      - uses: actions/checkout@v4 #permet de marcher avec tout vu sur internet 
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest #lancement test pystest