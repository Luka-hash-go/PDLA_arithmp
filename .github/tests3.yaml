name: Release

on:
  push:
    tags:
      - '*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          
      - uses: astral-sh/setup-uv@v3

      - name: Construire le package
        run: uv build

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*